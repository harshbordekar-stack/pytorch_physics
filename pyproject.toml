[project]
name = "pytorch_physics"
version = "1.0"
requires-python = ">=3.9"

dependencies = ["torch"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]